# Schema of the content vault, read by the build (scripts/validateContent.js) & by handle (tools/handle/), so both
# agree on what a note may hold. The templates (Templates/) give each collection's fields, in order, & their
# defaults (handle fills a collection's first template); this file gives their types. The build checks that the two
# list the same fields.
#
# Field types (any field may be left empty, unless required):
#   text            a string
#   list            a list of strings; `item` sets their type (text by default)
#   tag             lowercase words joined by hyphens, nested with slashes (eg. "magical-realism")
#   bool            true or false
#   year            an integer, eg. 1985 (negative for BCE)
#   count           a whole number ≥ 0 (eg. pages, metres)
#   series-number   a number ≥ 0 with at most one decimal: a book's place in its series (0 a prequel, 2.5 between)
#   number          a number ≥ 0 (eg. kilometres)
#   date            a full date, eg. 2024-06-28
#   partial-date    a date as precise as known: 2024-06-28, "2024-05" or "2023" (quoted, so YAML keeps it as text)
#   time            a duration "h:mm", eg. "3:45"
#   rating          1–5 in quarter steps
#   initials        2 or 3 capital letters, eg. JS (so no names get published by accident)
#   isbn            a quoted ISBN-10 or ISBN-13, digits only (an X allowed last in ISBN-10), with a valid checksum
#   doi, arxiv, url identifiers, eg. 10.1000/xyz123, 2107.03374 (or math/0211159), https://…
#   tmdb            "movie/<id>" or "tv/<id>", as TMDB's ids are per media type
#   igdb            the game's slug on IGDB (igdb.com/games/<slug>)
#   digits          a numeric id, eg. of an iNaturalist observation, or a game on BoardGameGeek
#   attachment      a path from the vault root into attachments/<dir>/, eg. attachments/covers/the-cave-saramago.jpg
#   enum            one of `values` (which may include true & false, eg. owned: true, false or wishlist)
#   status          one of the collection's status words (below)
#
# A field may name another it `requires` (eg. series-number, series). A collection may list sets of fields that are
# `unique` together: no two of its notes may share all their values (eg. two novels both Discworld 8).
#
# Slugs (filenames, which are also URLs) take a style: kebab ("after-hours-1985"), citekey (Zotero's, eg.
# "kripkeNamingNecessity1980"), or dated ("2026-10-01-table-mountain", whose date must match the `date` field).
# `from` says how handle makes one: fields in braces, with `|short` (title without its subtitle) & `|surname`.

# What each status means, shared across collections, which name them in their own words (a collection needn't name
# every role). Each role may stamp date fields with today when an entry takes it on, & may forbid fields, which
# must then be empty, or false (as nothing in the backlog has been started, & only what's yet to be begun or
# resumed is shortlisted); both apply only to fields the collection has (board games have first-played, rather
# than started & finished). Its colour is handle's.
roles:
  backlog: { colour: yellow, forbids: [ started, finished, first-played ] }
  active: { colour: cyan, stamps: [ started ], forbids: [ finished, shortlist ] }
  paused: { colour: blue, forbids: [ finished ] }
  ongoing: { colour: magenta, forbids: [ finished, shortlist ] } # with nothing to finish (eg. Minecraft), so never done
  done: { colour: green, stamps: [ finished, first-played ], forbids: [ shortlist ] }
  dropped: { colour: red, forbids: [ shortlist ] }

# fields shared by every collection with a status (novels, nonfiction, films, games & board games), added to their
# `fields` (dates are each collection's own)
tracked:
  status: { type: status, required: true }
  rating: { type: rating }
  shortlist: { type: bool }
  recommended-by: { type: initials }
  tags: { type: list, item: tag }

destinations: &destinations [ whoami, traveller, companion, campfire, moon-and-stars, realm-of-forms, garden ]

collections:
  novels:
    template: Novel.md
    destination: moon-and-stars
    slug: { style: kebab, from: "{title|short}-{author|surname}" }
    status: { backlog: to-read, active: reading, paused: paused, done: read, dropped: dnf }
    unique: [ [ series, series-number ] ]
    fields:
      title: { type: text, required: true }
      aliases: { type: list }
      author: { type: text }
      translator: { type: text }
      series: { type: text }
      series-number: { type: series-number, requires: series }
      year: { type: year }
      isbn: { type: isbn }
      pages: { type: count }
      cover: { type: attachment, dir: covers }
      owned: &owned { type: enum, values: [ true, false, wishlist ] } # wishlist: not owned, but wanted
      started: { type: partial-date }
      finished: { type: partial-date }

  nonfiction:
    template: Nonfiction.md
    destination: realm-of-forms
    slug: { style: citekey }
    status: { backlog: to-read, active: reading, paused: paused, done: read, dropped: dnf }
    fields:
      title: { type: text, required: true }
      aliases: { type: list }
      kind: { type: enum, values: [ textbook, book, paper ] }
      authors: { type: list }
      translator: { type: text }
      year: { type: year }
      isbn: { type: isbn }
      topics: { type: list, item: tag }
      doi: { type: doi }
      arxiv: { type: arxiv }
      url: { type: url }
      owned: *owned
      started: { type: partial-date }
      finished: { type: partial-date }

  films:
    template: Film.md
    destination: moon-and-stars
    slug: { style: kebab, from: "{title}-{year}" }
    status: { backlog: to-watch, active: watching, paused: paused, done: watched, dropped: dnf }
    fields:
      title: { type: text, required: true }
      aliases: { type: list }
      kind: { type: enum, values: [ film, series, anime ] }
      year: { type: year }
      director: { type: text }
      tmdb: { type: tmdb }
      poster: { type: attachment, dir: posters }
      started: { type: partial-date }
      finished: { type: partial-date }

  games:
    template: Game.md
    destination: moon-and-stars
    slug: { style: kebab, from: "{title}-{year}" }
    status: { backlog: to-play, active: playing, paused: paused, ongoing: endless, done: played, dropped: dnf }
    fields:
      title: { type: text, required: true }
      aliases: { type: list }
      year: { type: year }
      developer: { type: text }
      platform: { type: text }
      igdb: { type: igdb }
      cover: { type: attachment, dir: covers }
      owned: *owned
      started: { type: partial-date }
      finished: { type: partial-date }

  boardgames:
    template: Board Game.md
    destination: moon-and-stars
    slug: { style: kebab, from: "{title}-{year}" }
    # played: played at all, as board games are made to be played again (few can be finished, & even campaigns
    # replay), so they're never in progress, paused or dropped
    status: { backlog: to-play, done: played }
    fields:
      title: { type: text, required: true }
      aliases: { type: list }
      year: { type: year }
      designer: { type: text }
      players: { type: text } # how many can play, eg. "2–4", "1–5", "3+" or "2"
      bgg: { type: digits }   # the game's id on BoardGameGeek (boardgamegeek.com/boardgame/<id>)
      cover: { type: attachment, dir: covers }
      owned: *owned
      first-played: { type: partial-date } # stamped once, & kept through replays

  adventures:
    template: Adventure.md
    destination: traveller
    slug: { style: dated, from: "{date}-{place}" }
    fields:
      title: { type: text, required: true }
      aliases: { type: list }
      date: { type: date, required: true }
      activity: { type: text }
      place: { type: text }
      grade: { type: text }
      distance: { type: number }
      time: { type: time }
      ascent: { type: count }
      gpx: { type: attachment, dir: gpx }
      photos: { type: list, item: attachment, dir: photos }
      tags: { type: list, item: tag }

  garden:
    template: Sighting.md
    destination: garden
    slug: { style: dated, from: "{date}-{title}" }
    fields:
      title: { type: text, required: true }
      aliases: { type: list }
      date: { type: date, required: true }
      inaturalist: { type: digits }
      species: { type: text }
      place: { type: text }
      photos: { type: list, item: attachment, dir: photos }
      tags: { type: list, item: tag }

  blog:
    template: Post.md
    destination: realm-of-forms
    slug: { style: kebab, from: "{title}" }
    fields:
      title: { type: text, required: true }
      aliases: { type: list }
      date: { type: date, required: true }
      draft: { type: bool }
      tags: { type: list, item: tag }

  pages:
    template: [ Page.md, List.md ] # a page, or a ranked list
    slug: { style: kebab, from: "{title}" }
    fields:
      title: { type: text, required: true }
      aliases: { type: list }
      destination: { type: enum, values: *destinations, required: true }
      draft: { type: bool }
